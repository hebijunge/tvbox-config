name: daily-fetch
# 每日一次：北京时间 03:00（UTC 19:00），支持手动触发
# P2：refresh（本工作流，拉取+合并+发布）与 validate（validate.yml，独立验活）拆分——azhansy/ds-tvbox 模式

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-fetch
  cancel-in-progress: false

jobs:
  fetch-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          # 完整历史：下游 `git pull --rebase` 需要真实 merge-base；
          # 浅克隆(depth=1)下 rebase 会把同名文件误判为 add/add 冲突
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 单元测试（config_decode / 吸收点 P1-P2 行为回归）
        run: python -m unittest discover -s tests -v

      - name: 镜像复测并动态重排 GH_MIRRORS（实测延迟/吞吐，首位=运行时前缀；失败回退默认顺序）
        continue-on-error: true
        run: python scripts/mirror_probe.py

      - name: 接口实测（L1-L3 + type3 连通性）—— 为去重与排序提供实测数据
        # 基于上一轮产物跑：探针需要 tvbox.json，而本轮合并又需要探针结论，一轮延迟自洽即可
        continue-on-error: true
        run: |
          python scripts/probe_sites.py --only http --concurrency 24 || true
          python scripts/probe_spiders.py --concurrency 24 || true
          python scripts/probe_js.py --concurrency 20 || true
          python scripts/dedup_mirrors.py || true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: drpy 本地 JS 源五关实测（Node 沙箱，CI 可跑）
        # 覆盖 270 个 type=3 本地 JS 源：真机 jar 测的是 csp_* 类，覆盖不到这批。
        # 这一路纯 Node+curl，能在 CI 直接跑 → 产物每日自动更新；
        # csp 真机五关无法在 CI 跑，仍靠手工产出（见 docs/ARCHITECTURE.md 的时效降权说明）。
        continue-on-error: true
        run: |
          cd drpy-sandbox && npm i --no-audit --no-fund
          cd ..
          python scripts/drpy_probe.py --workers 5 || true

      - name: 全网上游发现（四路：代码搜索 / 仓库搜索 / 种子递归 / 血统反查）
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Gitee 文件树 API 配额用（搜索 API 已被平台禁，曲线方案只需配额）
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: python scripts/discover_upstreams.py --max-repos 15 --pages 2 || true

      - name: 候选独有度评估，并按 unique 收编 canary
        # 必须在 discover 之后：canary 收编标准看「独有站点数」，不是 discover 的 score。
        # 实测证明 score 与新内容价值无关（score30 的候选带来 17 个新站，score90 只有 3 个），
        # 按 score 收编会漏掉最有价值的候选。此步会用 unique 版覆盖 discover 写的 score 版。
        continue-on-error: true
        run: python scripts/evaluate_candidates.py --min-unique 3 --write-canary || true

      - name: 拉取上游并合并生成配置（含快照/黑白名单/分类测速/checks/空产物守卫）
        id: fetch_merge
        env:
          CONCURRENCY: "24"
          # canary 上游已按「独有站点数 unique>=3」自动收编（不是按 score），
          # 且失效由自动黑名单兜底，故开启并入。要停用改回 "0" 即可。
          EXTRA_UPSTREAMS: "1"
        run: |
          python scripts/fetch_merge.py
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -eq 2 ]; then
            echo "guard=true" >> "$GITHUB_OUTPUT"
            echo "::warning::空产物守卫触发：本轮聚合产物异常，跳过提交与 Release，保留上次缓存"
            exit 0
          fi
          exit $rc

      - name: 依赖审计（只报告，不删除）
        continue-on-error: true
        run: python scripts/dep_audit.py || true

      - name: 入库（接口 / 检测历史 / 依赖关系）
        # DB 不入库（二进制会让仓库膨胀），健康快照以 exports/health_index.json 文本留档：
        # 每天 diff 能直接看出哪些源从 healthy 掉成 dead，比二进制友好。
        continue-on-error: true
        run: |
          python scripts/store.py --ingest-sites tvbox.json --ingest-lives tvbox.json \
            --ingest-probes probe/sites_probe.json probe/spider_probe.json probe/js_probe.json \
                            probe/csp_probe.json probe/drpy_probe.json \
            --ingest-upstreams status.json --prune --stats || true

      - name: 导出接口清单（全部 / 仅健康 / 可用 / 按类型 / 健康索引）
        run: python scripts/export_healthy.py || true

      - name: 健康趋势日报（新增 / 掉线 / 恢复）
        # 快照需随仓库保留，否则每次都是「首次运行」、永远对比不出变化
        continue-on-error: true
        run: python scripts/health_report.py || true

      - name: 生成本地接口包（离线自洽 zip，点播/直播/短剧+全部依赖）
        # 本地包随 Release 发布；成人配置不进本地包（fetch_merge 不再写 .workbuddy 留档，
        # pack_local 默认找不到留档自动跳过 → Release 附件 zip 不含 adult，通路隔离）
        continue-on-error: true
        run: python scripts/pack_local.py || true

      - name: 提交并推送（有变更时；守卫触发则仅落守卫日报）
        if: steps.fetch_merge.outputs.guard != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # adult.json 每日随聚合产出并提交更新（所有者 2026-09-22 指令）；它不进 Release
          # 附件白名单 / Pages / 导航页，也不在 README 声明——公开通路隔离见 pages.yml 与下方白名单。
          git add tvbox.json vod.json live.json short.json adult.json list.json status.json checks.json README.md \
                  index.html lives/ state/ snapshot/ candidate_upstreams.json deps/ stores/ probe/ radar/ exports/ drpy-sandbox/
          # pack_report.json 仅在 pack_local 成功时存在，防缺失阻断提交
          [ -f packs/pack_report.json ] && git add packs/pack_report.json || true
          if git diff --cached --quiet; then
            echo "本轮无变更，跳过提交"
          else
            git commit -m "chore: daily update $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi

      - name: 守卫日报（空产物守卫触发时只提交守卫记录，产物保留上次缓存）
        if: steps.fetch_merge.outputs.guard == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/guard_last.json state/upstreams_state.json state/blacklist_auto.txt || true
          if git diff --cached --quiet; then
            echo "守卫触发且无状态变更，跳过提交"
          else
            git commit -m "chore(guard): 空产物守卫触发，跳过本轮发布（保留上次缓存，下轮重试）"
            git pull --rebase origin main || true
            git push || true
          fi

      - name: 发布到 Releases（latest 标签，Guovin 双通道模式）
        if: steps.fetch_merge.outputs.guard != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES=""
          for f in tvbox.json vod.json live.json short.json list.json status.json checks.json \
                   stores/duocang.json stores/cms.json stores/app.json stores/pan.json stores/csp.json stores/pan_ck.json \
                   lives/live.txt lives/live_cctv.txt lives/live_weishi.txt \
                   lives/live_gangtai.txt lives/live_other.txt \
                   packs/tvbox-latest.zip; do
            [ -f "$f" ] && FILES="$FILES $f"
          done
          NOTES="自动发布于 $(date -u '+%Y-%m-%d %H:%M UTC')。
          产物：tvbox.json（完整合并配置）、vod.json（点播）、live.json（直播）、short.json（短剧独立配置）、lives/*（央视/卫视/港台分类直播）、stores/duocang.json（多仓入口：CMS·代理 + 蜘蛛仓·代理 两条线路，子仓内部依赖引用一律本仓库路径）、stores/pan_ck.json（网盘 CK 获取指引）、checks.json（上游校验状态）。
          packs/tvbox-latest.zip 为离线自洽本地包（配置+依赖+使用说明，解压后本地导入即用）。2026-09-22 起改固定名每日 --clobber 覆盖，不再按日期累积；历史日期名 zip 已由 release_cleanup 清理。
          在线导航页（第三条通路，与 raw / Releases 并列）：https://hebijunge.github.io/tvbox-config/
          固定引用本 Release：https://github.com/hebijunge/tvbox-config/releases/download/latest/tvbox.json"
          if gh release view latest -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload latest $FILES -R "$GITHUB_REPOSITORY" --clobber
            gh release edit latest -R "$GITHUB_REPOSITORY" --title "TVBox 配置 latest" --notes "$NOTES"
          else
            gh release create latest $FILES -R "$GITHUB_REPOSITORY" \
              --title "TVBox 配置 latest" --notes "$NOTES"
          fi
          # P1-2 卫生修复：白名单外陈旧资产清理（_proxy.json / 历史日期名 zip 等）。
          # adult.json 不在本白名单（「不声明」通路）；release_cleanup 永不清理名单仅作兜底。
          python scripts/release_cleanup.py \
            --keep tvbox.json,vod.json,live.json,short.json,list.json,status.json,checks.json,tvbox-latest.zip || true
